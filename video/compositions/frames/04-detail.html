<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="f4-detail-template">
      <style>
        @font-face {
          font-family: "Instrument Serif";
          src: url("../../assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
          font-style: normal;
          font-weight: 400;
        }
        @font-face {
          font-family: "JetBrains Mono";
          src: url("../../assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");
          font-weight: 100 800;
        }
        #f4-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0b0c16;
        }
        /* Same camera and lens as the end of 03-needs-you, so the crossfade reads as one shot.
           Lens geometry in frame px; the lens sits over its target: cx = ox + px·k. */
        #f4-stage {
          position: absolute;
          inset: 0;
          --k: 0.85;
          --ox: -503;
          --oy: -176;
          --px: 1995;
          --py: 916;
          --cx: 1193;
          --cy: 602;
          --r: 350;
          --m: 1.35;
        }
        #f4-stage .shot {
          position: absolute;
          left: calc(var(--ox) * 1px);
          top: calc(var(--oy) * 1px);
          width: calc(var(--k) * 3456px);
          max-width: none;
        }
        #f4-base {
          position: absolute;
          inset: 0;
          filter: blur(10px) brightness(0.4) saturate(0.8);
        }
        #f4-lens {
          position: absolute;
          inset: 0;
          clip-path: circle(calc(var(--r) * 1px) at calc(var(--cx) * 1px) calc(var(--cy) * 1px));
        }
        #f4-lens .shot {
          transform-origin: calc(var(--px) * var(--k) * 1px) calc(var(--py) * var(--k) * 1px);
          transform: translate(calc((var(--cx) - var(--ox) - var(--px) * var(--k)) * 1px),
              calc((var(--cy) - var(--oy) - var(--py) * var(--k)) * 1px))
            scale(var(--m));
        }
        #f4-rim {
          position: absolute;
          left: calc((var(--cx) - var(--r)) * 1px);
          top: calc((var(--cy) - var(--r)) * 1px);
          width: calc(var(--r) * 2px);
          height: calc(var(--r) * 2px);
          border-radius: 50%;
          border: 3px solid rgba(221, 247, 255, 0.75);
          box-shadow: inset 0 0 0 1.5px rgba(130, 251, 156, 0.55), 0 0 60px rgba(130, 251, 156, 0.12),
            0 18px 60px rgba(0, 0, 0, 0.6);
        }
        #f4-rim::after {
          content: "";
          position: absolute;
          left: 12%;
          top: 8%;
          width: 30%;
          height: 16%;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(221, 247, 255, 0.16), rgba(221, 247, 255, 0));
          transform: rotate(-30deg);
        }
        #f4-scrim {
          position: absolute;
          inset: 0;
          background: linear-gradient(to top, rgba(11, 12, 22, 0.94) 0%, rgba(11, 12, 22, 0.6) 26%, rgba(11, 12, 22, 0) 46%);
        }
        #f4-cap {
          position: absolute;
          left: 110px;
          top: 700px;
          width: 760px;
          height: 240px;
        }
        #f4-root .cap {
          position: absolute;
          left: 0;
          top: 0;
        }
        #f4-root .lbl {
          font-family: "JetBrains Mono", monospace;
          font-size: 28px;
          letter-spacing: 0.16em;
          color: #82fb9c;
          margin-bottom: 16px;
        }
        #f4-root .serif {
          font-family: "Instrument Serif", serif;
          font-weight: 400;
          font-size: 86px;
          line-height: 1.02;
          letter-spacing: -0.03em;
          color: #ddf7ff;
        }
        #f4-root .serif > span {
          display: block;
        }
        #f4-root .w {
          display: inline-block;
          margin-right: 0.22em;
        }
        #f4-root .lbl.w {
          margin-right: 0;
        }
      </style>

      <div data-hf-id="hf-2ow8" id="f4-root" data-composition-id="f4-detail" data-width="1920" data-height="1080">
        <div data-hf-id="hf-qcey" id="f4-stage">
          <div data-hf-id="hf-cpdz" id="f4-base"><img data-hf-id="hf-4b10" class="shot" src="../../assets/screens/hero.png" alt=""></div>
          <div data-hf-id="hf-tgvg" id="f4-lens"><img data-hf-id="hf-gkj0" class="shot" src="../../assets/screens/hero.png" alt=""></div>
          <div data-hf-id="hf-3jl4" id="f4-rim"></div>
        </div>
        <div data-hf-id="hf-hi16" id="f4-scrim"></div>
        <div data-hf-id="hf-fngo" id="f4-cap">
          <div data-hf-id="hf-wfg5" class="cap" id="f4-c1">
            <div data-hf-id="hf-ti34" class="lbl w">ACTIVITY</div>
            <div data-hf-id="hf-xxin" class="serif"><span data-hf-id="hf-uckh"><span data-hf-id="hf-4q4b" class="w">Every</span><span data-hf-id="hf-k1z6" class="w">tool</span><span data-hf-id="hf-ch98" class="w">call,</span></span><span data-hf-id="hf-l73p"><span data-hf-id="hf-o4zg" class="w">live.</span></span></div>
          </div>
          <div data-hf-id="hf-0dk6" class="cap" id="f4-c2">
            <div data-hf-id="hf-mzi8" class="lbl w">DETAIL</div>
            <div data-hf-id="hf-c8pb" class="serif"><span data-hf-id="hf-me0s"><span data-hf-id="hf-zcg5" class="w">Context,</span><span data-hf-id="hf-awzn" class="w">cost,</span></span><span data-hf-id="hf-lzpr"><span data-hf-id="hf-yd29" class="w">PRs,</span><span data-hf-id="hf-njby" class="w">subagents.</span></span></div>
          </div>
          <div data-hf-id="hf-6j9z" class="cap" id="f4-c3">
            <div data-hf-id="hf-qdyj" class="lbl w">PLAN · RUNS</div>
            <div data-hf-id="hf-buea" class="serif"><span data-hf-id="hf-n6mu"><span data-hf-id="hf-qgq3" class="w">Plan</span><span data-hf-id="hf-difl" class="w">and</span><span data-hf-id="hf-avky" class="w">runs,</span></span><span data-hf-id="hf-msbt"><span data-hf-id="hf-xtml" class="w">at</span><span data-hf-id="hf-b7a3" class="w">a</span><span data-hf-id="hf-tdyu" class="w">glance.</span></span></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const stage = "#f4-stage";
          const caps = ["#f4-c1", "#f4-c2", "#f4-c3"].map((s) => gsap.utils.toArray(s + " .w"));

          // Waterfall cut helpers (cut-catalog.md §4).
          function waterfallIn(words, t, from) {
            let gap = 0.05, at = t;
            words.forEach((w) => {
              tl.fromTo(w, { x: 230, opacity: from }, { x: 0, opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, at);
              at += gap;
              gap *= 0.84;
            });
          }
          function waterfallOut(words, t) {
            words.forEach((w, i) => {
              tl.to(w, { x: -230, duration: 0.34, ease: "power4.in" }, t + i * 0.022);
              tl.to(w, { opacity: 0, duration: 0.18, ease: "power1.in" }, t + i * 0.022);
            });
            return t + (words.length - 1) * 0.022 + 0.18;
          }
          gsap.set(caps.flat(), { opacity: 0, x: 230 });

          // Stop 1 — activity, with T3's own tool icons (a short settle from 03's lens).
          tl.to(stage, { "--px": 1918, "--py": 985, "--cx": 1127, "--cy": 661, "--r": 340,
            duration: 1.0, ease: "power3.inOut" }, 0.35);
          waterfallIn(caps[0], 0.75, 0);

          // Stop 2 — the facts strip: subagents, PR, context, cost.
          tl.to(stage, { "--px": 2205, "--py": 657, "--cx": 1371, "--cy": 382,
            duration: 1.3, ease: "power3.inOut" }, 3.0);
          waterfallIn(caps[1], waterfallOut(caps[0], 3.35), 0.35);

          // Stop 3 — plan progress and the runs chart; the camera lifts with the lens.
          tl.to(stage, { "--oy": -330, "--px": 2143, "--py": 1279, "--cx": 1318, "--cy": 757,
            duration: 1.4, ease: "power3.inOut" }, 6.3);
          waterfallIn(caps[2], waterfallOut(caps[1], 6.7), 0.35);

          window.__timelines["f4-detail"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
